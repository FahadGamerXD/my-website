<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Plus Jakarta Sans',sans-serif;
background:#05070d;
color:white;
}

/* LOADER */
#loader{
position:fixed;top:0;left:0;
width:100%;height:100%;
background:#05070d;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:9999;
transition:0.8s;
}

.spinner{
width:70px;height:70px;
border:4px solid rgba(255,255,255,0.1);
border-top:4px solid #00e5ff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{100%{transform:rotate(360deg);}}

#loader h2{margin-top:20px;color:#00e5ff;}

/* HEADER */
header{
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

a{
color:#00e5ff;
text-decoration:none;
font-weight:600;
}

/* TITLE */
h1{
padding:20px 8%;
font-size:40px;
}

/* GRID */
.grid{
padding:20px 8%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

/* CARD */
.card{
position:relative;
border-radius:15px;
overflow:hidden;
cursor:pointer;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
transition:0.4s;
}

.card:hover img{
transform:scale(1.1);
}

/* OVERLAY */
.overlay{
position:absolute;
bottom:0;
width:100%;
background:linear-gradient(transparent, rgba(0,0,0,0.9));
padding:15px;
opacity:0;
transition:0.3s;
}

.card:hover .overlay{
opacity:1;
}

.overlay h3{
margin:0;
}

/* DOWNLOAD BUTTON */
.download-btn{
margin-top:10px;
display:inline-block;
background:#00e5ff;
color:black;
padding:8px 15px;
border-radius:20px;
font-size:12px;
text-decoration:none;
font-weight:700;
}

/* LIGHTBOX */
#lightbox{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.9);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

#lightbox img{
max-width:90%;
max-height:80%;
border-radius:10px;
}

#lightbox span{
position:absolute;
top:20px;
right:30px;
font-size:30px;
cursor:pointer;
color:white;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
<div class="spinner"></div>
<h2>Loading Gallery...</h2>
</div>

<header>
<div style="font-weight:800;">AIART.</div>
<a href="index.html">← Back Home</a>
</header>

<h1>My AI Ads Portfolio</h1>

<div class="grid">

<!-- CARD 1 -->
<div class="card" onclick="openLightbox('images/ad1.jpg')">
<img src="images/ad1.jpg">
<div class="overlay">
<h3>Coffee Ad</h3>
<a href="images/ad1.jpg" download class="download-btn">Download</a>
</div>
</div>

<!-- CARD 2 -->
<div class="card" onclick="openLightbox('images/ad2.jpg')">
<img src="images/ad2.jpg">
<div class="overlay">
<h3>Coke Ad</h3>
<a href="images/ad2.jpg" download class="download-btn">Download</a>
</div>
</div>

<!-- CARD 3 -->
<div class="card" onclick="openLightbox('images/ad3.jpg')">
<img src="images/ad3.jpg">
<div class="overlay">
<h3>Perfume Ad</h3>
<a href="images/ad3.jpg" download class="download-btn">Download</a>
</div>
</div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox">
<span onclick="closeLightbox()">×</span>
<img id="lightbox-img">
</div>

<script>
window.addEventListener("load",()=>{
setTimeout(()=>{
document.getElementById("loader").style.opacity="0";
document.getElementById("loader").style.visibility="hidden";
},1500);
});

function openLightbox(src){
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=src;
}

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}
</script>

</body>
</html>
