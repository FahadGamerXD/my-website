<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Plus Jakarta Sans',sans-serif;
background:#05070d;
color:white;
}

/* LOADER */
#loader{
position:fixed;top:0;left:0;
width:100%;height:100%;
background:#05070d;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:9999;
transition:0.8s;
}

.spinner{
width:70px;height:70px;
border:4px solid rgba(255,255,255,0.1);
border-top:4px solid #00e5ff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

#loader h2{
margin-top:20px;
color:#00e5ff;
}

/* HEADER */
header{
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

a{
color:#00e5ff;
text-decoration:none;
font-weight:600;
}

/* TITLE */
h1{
padding:20px 8%;
font-size:40px;
}

/* GRID */
.grid{
padding:20px 8%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
border-radius:15px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
border-color:#00e5ff;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card h3{
padding:10px;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
<div class="spinner"></div>
<h2>Loading Gallery...</h2>
</div>

<header>
<div style="font-weight:800;">AIART.</div>
<a href="index.html">← Back Home</a>
</header>

<h1>Full AI Gallery</h1>

<div class="grid">

<div class="card"><img src="https://images.unsplash.com/photo-1520975958225-2d1f9c5f2d6a"><h3>Luxury Ad</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1503602642458-232111445657"><h3>Car Concept</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"><h3>Perfume Ad</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1526948128573-703ee1aeb6fa"><h3>Fashion AI</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"><h3>Tech Poster</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d"><h3>Creative Art</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1526045612212-70caf35c14df"><h3>Neon Ad</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1520975682031-a8b7f8a6f8a2"><h3>AI Concept</h3></div>

</div>

<script>
window.addEventListener("load",()=>{
setTimeout(()=>{
document.getElementById("loader").style.opacity="0";
document.getElementById("loader").style.visibility="hidden";
},1500);
});
</script>

</body>
</html>
