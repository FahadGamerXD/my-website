<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Plus Jakarta Sans',sans-serif;
background:#05070d;
color:white;
}

/* LOADER */
#loader{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#05070d;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:9999;
transition:0.8s;
}

.spinner{
width:70px;height:70px;
border:4px solid rgba(255,255,255,0.1);
border-top:4px solid #00e5ff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{100%{transform:rotate(360deg);}}

/* HEADER */
header{
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

a{
color:#00e5ff;
text-decoration:none;
font-weight:600;
}

/* TITLE */
h1{
padding:20px 8%;
font-size:40px;
}

/* GRID */
.grid{
padding:20px 8%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

/* CARD */
.card{
position:relative;
border-radius:15px;
overflow:hidden;
cursor:pointer;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
transition:0.4s;
}

.card:hover img{
transform:scale(1.1);
}

/* OVERLAY */
.overlay{
position:absolute;
bottom:0;
width:100%;
background:linear-gradient(transparent, rgba(0,0,0,0.9));
padding:15px;
opacity:0;
transition:0.3s;
}

.card:hover .overlay{
opacity:1;
}

.overlay h3{
margin:0;
}

/* DOWNLOAD */
.download-btn{
margin-top:10px;
display:inline-block;
background:#00e5ff;
color:black;
padding:8px 15px;
border-radius:20px;
font-size:12px;
font-weight:700;
}

/* LIGHTBOX */
#lightbox{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.9);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

#lightbox img{
max-width:90%;
max-height:80%;
border-radius:10px;
}

#lightbox span{
position:absolute;
top:20px;
right:30px;
font-size:30px;
cursor:pointer;
color:white;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
<div class="spinner"></div>
<h2>Loading Gallery...</h2>
</div>

<!-- HEADER -->
<header>
<div style="font-weight:800;">AIART.</div>
<a href="index.html">← Back Home</a>
</header>

<h1>My AI Ads Gallery</h1>

<!-- GRID -->
<div class="grid" id="gallery"></div>

<!-- LIGHTBOX -->
<div id="lightbox">
<span onclick="closeLightbox()">×</span>
<img id="lightbox-img">
</div>

<script>
// LOADER
window.addEventListener("load",()=>{
setTimeout(()=>{
document.getElementById("loader").style.opacity="0";
document.getElementById("loader").style.visibility="hidden";
},1200);
});

// IMAGES LIST (ADD YOUR 25 IMAGES HERE)
const images = [
"images/ad1.jpg",
"images/ad2.jpg",
"images/ad3.jpg",
"images/ad4.jpg",
"images/ad5.jpg",
"images/ad6.jpg",
"images/ad7.jpg",
"images/ad8.jpg",
"images/ad9.jpg",
"images/ad10.jpg",
"images/ad11.jpg",
"images/ad12.jpg",
"images/ad13.jpg",
"images/ad14.jpg",
"images/ad15.jpg",
"images/ad16.jpg",
"images/ad17.jpg",
"images/ad18.jpg",
"images/ad19.jpg",
"images/ad20.jpg",
"images/ad21.jpg",
"images/ad22.jpg",
"images/ad23.jpg",
"images/ad24.jpg",
"images/ad25.jpg"
];

const gallery = document.getElementById("gallery");

// AUTO CREATE GALLERY
images.forEach((img, i)=>{
gallery.innerHTML += `
<div class="card" onclick="openLightbox('${img}')">
  <img src="${img}">
  <div class="overlay">
    <h3>AI Ad ${i+1}</h3>
    <a href="${img}" download class="download-btn">Download</a>
  </div>
</div>
`;
});

// LIGHTBOX
function openLightbox(src){
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=src;
}

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}
</script>

</body>
</html>
