<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahad | Portfolio</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0c10; /* Dark background as seen in your screenshot */
            color: white;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links a {
            color: #ccc;
            text-decoration: none;
            margin-left: 30px;
            font-size: 14px;
        }

        /* Hero Section Container */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 80vh;
            padding: 0 8%;
            gap: 50px;
        }

        /* Left Side: Text Content */
        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .hero-text h1 span {
            color: #34b3e4; /* Light blue color from your screenshot */
        }

        .hero-text p {
            font-size: 18px;
            color: #888;
            margin-bottom: 30px;
            max-width: 500px;
        }

        .btn {
            background-color: #34b3e4;
            color: #000;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        /* Right Side: Image Content */
        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .hero-image img {
            width: 100%;
            max-width: 450px; /* Aap isko chota bada kar sakte hain */
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(52, 179, 228, 0.2); /* Subtle blue glow */
            object-fit: cover;
        }

        /* Responsive for Mobile */
        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding-top: 50px;
            }
            .hero-text h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Fahad</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Work</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-text">
            <h1>I Build <span>Premium</span> <br> Web Experiences</h1>
            <p>Modern, high-converting websites designed to impress and perform.</p>
            <button class="btn">Start Project</button>
        </div>

        <div class="hero-image">
            <!-- Apni file ka sahi naam yahan likhein -->
            <img src="profile.jpg" alt="Fahad Portrait">
        </div>
    </section>

</body>
</html>
