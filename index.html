<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fahad | Ultra Pro Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
    scroll-behavior: smooth;
}

body {
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: white;
    overflow-x: hidden;
}

/* CURSOR GLOW */
.cursor {
    width: 20px;
    height: 20px;
    background: #38bdf8;
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    mix-blend-mode: difference;
    transform: translate(-50%, -50%);
}

/* NAVBAR */
header {
    display: flex;
    justify-content: space-between;
    padding: 20px 60px;
    position: fixed;
    width: 100%;
    z-index: 1000;
    background: rgba(2,6,23,0.6);
    backdrop-filter: blur(10px);
}

nav a {
    color: white;
    margin: 0 15px;
    text-decoration: none;
    position: relative;
}

nav a::after {
    content: "";
    height: 2px;
    width: 0%;
    background: #38bdf8;
    position: absolute;
    bottom: -5px;
    left: 0;
    transition: 0.3s;
}

nav a:hover::after {
    width: 100%;
}

/* HERO */
.hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 100px 20px;
    flex-wrap: wrap;
}

.hero-text h1 {
    font-size: 50px;
}

.hero-text span {
    color: #38bdf8;
    text-shadow: 0 0 20px #38bdf8;
}

.typing {
    color: #38bdf8;
    margin-top: 10px;
}

.btn {
    margin-top: 20px;
    padding: 12px 25px;
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.1);
}

/* IMAGE */
.hero img {
    width: 260px;
    border-radius: 50%;
    box-shadow: 0 0 50px rgba(56,189,248,0.7);
    animation: float 4s ease-in-out infinite;
}

@keyframes float {
    50% { transform: translateY(-20px); }
}

/* SECTION */
.section {
    padding: 100px 20px;
    text-align: center;
}

/* CARDS */
.card-container {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
}

.card {
    width: 250px;
    padding: 20px;
    border-radius: 15px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    transition: 0.4s;
}

.card:hover {
    transform: translateY(-15px) scale(1.05);
}

/* FOOTER */
footer {
    padding: 20px;
    text-align: center;
    background: #020617;
}
</style>
</head>

<body>

<div class="cursor"></div>

<header>
    <h2>Fahad</h2>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
    </nav>
</header>

<!-- HERO -->
<section class="hero" id="home">
    <div class="hero-text">
        <h1>Hi, I'm <span>Fahad</span></h1>
        <h3 class="typing"></h3>
        <button class="btn">🚀 Hire Me</button>
    </div>

    <img src="myphoto.jpg">
</section>

<!-- ABOUT -->
<section class="section" id="about">
    <h2>About Me</h2>
    <p>I create high-quality modern websites with clean UI and smooth UX.</p>
</section>

<!-- SKILLS -->
<section class="section" id="skills">
    <h2>Skills</h2>
    <div class="card-container">
        <div class="card">HTML</div>
        <div class="card">CSS</div>
        <div class="card">JavaScript</div>
    </div>
</section>

<!-- PROJECTS -->
<section class="section" id="projects">
    <h2>Projects</h2>
    <div class="card-container">
        <div class="card">Landing Page</div>
        <div class="card">Portfolio</div>
        <div class="card">UI Design</div>
    </div>
</section>

<footer>
    <p>© 2026 Fahad</p>
</footer>

<script>
// CURSOR
const cursor = document.querySelector(".cursor");
document.addEventListener("mousemove", e => {
    cursor.style.top = e.clientY + "px";
    cursor.style.left = e.clientX + "px";
});

// TYPING EFFECT
const text = ["Frontend Developer", "UI Designer", "Creative Thinker"];
let i = 0, j = 0, current = "", isDeleting = false;

function type() {
    current = text[i];
    
    if (isDeleting) {
        j--;
    } else {
        j++;
    }

    document.querySelector(".typing").textContent = current.substring(0, j);

    if (!isDeleting && j === current.length) {
        isDeleting = true;
        setTimeout(type, 1000);
    } else if (isDeleting && j === 0) {
        isDeleting = false;
        i = (i + 1) % text.length;
        setTimeout(type, 300);
    } else {
        setTimeout(type, isDeleting ? 50 : 100);
    }
}

type();
</script>

</body>
</html>
