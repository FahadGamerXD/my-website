<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter', sans-serif;
}

body{
  background:#0b0f1a;
  color:white;
  overflow-x:hidden;
}

/* NAVBAR */
nav{
  display:flex;
  justify-content:space-between;
  padding:25px 60px;
  position:fixed;
  width:100%;
  z-index:1000;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:25px;
  opacity:0.7;
  transition:0.3s;
}
nav a:hover{opacity:1;}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 60px;
}

.hero h1{
  font-size:80px;
  line-height:90px;
  font-weight:800;
}

.hero span{
  color:#4cc9f0;
}

.hero p{
  margin-top:20px;
  max-width:400px;
  opacity:0.7;
}

.btn{
  margin-top:30px;
  display:inline-block;
  padding:14px 28px;
  background:#4cc9f0;
  color:black;
  border-radius:30px;
  text-decoration:none;
  transition:0.3s;
}

.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 30px rgba(76,201,240,0.4);
}

/* IMAGE */
.hero-img{
  width:350px;
  height:450px;
  border-radius:200px;
  overflow:hidden;
  position:relative;
}

.hero-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* BIG TEXT SECTION */
.big-text{
  padding:120px 60px;
  background:#f2eee9;
  color:#111;
}

.big-text h2{
  font-size:60px;
  max-width:800px;
  line-height:70px;
}

.big-text span{
  color:#ff8c42;
}

/* PROJECTS */
.projects{
  padding:100px 60px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  height:200px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:0.5s;
}

.card:hover img{
  transform:scale(1.1);
}

/* CTA */
.cta{
  padding:120px 60px;
  background:#ff8c42;
  color:#111;
  text-align:center;
}

.cta h2{
  font-size:50px;
}

.cta a{
  margin-top:20px;
  display:inline-block;
  color:#111;
  font-weight:600;
}

/* SCROLL ANIMATION */
.fade{
  opacity:0;
  transform:translateY(40px);
  transition:1s;
}

.fade.show{
  opacity:1;
  transform:translateY(0);
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
  <h3>Fahad</h3>
  <div>
    <a href="#">Home</a>
    <a href="#">Work</a>
    <a href="#">Contact</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div>
    <h1>I Build <span>Premium</span><br>Web Experiences</h1>
    <p>Modern, high-converting websites designed to impress and perform.</p>
    <a href="#" class="btn">Start Project</a>
  </div>
    
    <!-- Aapki Picture yahan aayegi -->
    <div class="hero-image">
        <img src="profile.jpg" alt="Fahad">
    </div>
</div>
  <div class="hero-img">
    <img src="https://images.unsplash.com/photo-1603415526960-f8f0c92f7b02">
  </div>
</section>

<!-- BIG TEXT -->
<section class="big-text fade">
  <h2>
    I help brands grow with <span>design</span> that people love and remember.
  </h2>
</section>

<!-- PROJECTS -->
<section class="projects fade">
  <div class="grid">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1559028012-481c04fa702d">
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f">
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1492724441997-5dc865305da7">
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
    </div>
  </div>
</section>

<!-- CTA -->
<section class="cta fade">
  <h2>Let’s build something great</h2>
  <a href="#">Let’s talk →</a>
</section>

<script>
const faders = document.querySelectorAll('.fade');

window.addEventListener('scroll', () => {
  faders.forEach(el => {
    const top = el.getBoundingClientRect().top;
    if(top < window.innerHeight - 100){
      el.classList.add('show');
    }
  });
});
</script>

</body>
</html>
