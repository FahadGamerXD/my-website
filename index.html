<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juan Mora | Elite Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        :root {
            --primary: #f3967e;
            --bg: #f4f1ee;
            --dark: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; } /* Custom cursor ke liye default hide */

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--dark);
            overflow-x: hidden;
        }

        /* --- Custom Magic Cursor --- */
        #cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }

        /* --- Navigation --- */
        nav {
            display: flex;
            justify-content: space-between;
            padding: 40px 5%;
            position: fixed;
            width: 100%;
            z-index: 100;
        }

        .logo { font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .big-name {
            font-size: 18vw;
            font-weight: 900;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: -8px;
            line-height: 0.8;
            opacity: 0.8;
        }

        .hero-image {
            position: absolute;
            height: 85vh;
            z-index: 2;
            transition: transform 0.3s ease-out;
        }

        .hero-content {
            position: absolute;
            bottom: 10%;
            z-index: 3;
            text-align: center;
        }

        .pill {
            border: 1px solid var(--dark);
            border-radius: 50px;
            padding: 5px 20px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            transition: 0.3s;
        }

        /* --- Work/Services Section --- */
        .work-section { padding: 100px 5%; background: #fff; }
        
        .work-item {
            display: block;
            padding: 60px 0;
            border-bottom: 1px solid #eee;
            text-decoration: none;
            color: var(--dark);
            position: relative;
            overflow: hidden;
        }

        .work-item h2 { font-size: 4vw; text-transform: uppercase; transition: 0.5s; }
        
        .work-item:hover h2 { transform: translateX(30px); color: var(--primary); }

        .work-preview {
            position: absolute;
            right: 10%;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 300px;
            height: 200px;
            background: #ddd;
            transition: 0.5s;
            pointer-events: none;
            object-fit: cover;
        }

        .work-item:hover .work-preview { transform: translateY(-50%) scale(1); }

    </style>
</head>
<body>

    <div id="cursor"></div>

    <nav>
        <div class="logo">Juan Mora</div>
        <div>MENU</div>
    </nav>

    <section class="hero">
        <h1 class="big-name">JUAN</h1>
        <!-- Image from your file Personal-Portfolio-Luxury-Design-05-02-2026_12_07_PM.jpg -->
        <img src="your-photo.png" alt="Juan Mora" class="hero-image">
        <div class="hero-content">
            <h2 style="font-size: 3rem;">16 years <span class="pill">creative</span> designer</h2>
        </div>
    </section>

    <section class="work-section">
        <a href="#" class="work-item">
            <h2>Web Design</h2>
            <img src="https://via.placeholder.com/300x200" class="work-preview">
        </a>
        <a href="#" class="work-item">
            <h2>Branding</h2>
            <img src="https://via.placeholder.com/300x200" class="work-preview">
        </a>
        <a href="#" class="work-item">
            <h2>Ad Campaigns</h2>
            <img src="https://via.placeholder.com/300x200" class="work-preview">
        </a>
    </section>

    <script>
        // 1. Custom Cursor Movement
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.2 });
        });

        // 2. Hero Text Reveal
        gsap.from(".big-name", {
            y: 200,
            opacity: 0,
            duration: 1.5,
            ease: "power4.out"
        });

        // 3. Image Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth/2) * 0.02;
            const moveY = (e.clientY - window.innerHeight/2) * 0.02;
            gsap.to(".hero-image", { x: moveX, y: moveY, duration: 1 });
        });
    </script>
</body>
</html>
