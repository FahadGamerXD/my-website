<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahad Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 20px 50px;
            background: #020617;
        }

        header h1 {
            color: #38bdf8;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 80px 20px;
            flex-wrap: wrap;
        }

        .hero-text {
            max-width: 500px;
        }

        .hero-text h2 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hero-text span {
            color: #38bdf8;
        }

        .hero-text p {
            margin: 15px 0;
            color: #cbd5f5;
        }

        .btn {
            background: #38bdf8;
            padding: 12px 25px;
            border: none;
            color: black;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn:hover {
            background: #0ea5e9;
        }

        .hero img {
            width: 250px;
            border-radius: 50%;
            border: 4px solid #38bdf8;
        }

        .section {
            padding: 60px 20px;
            text-align: center;
        }

        .section h2 {
            margin-bottom: 20px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #020617;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    <h1>Fahad</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-text">
        <h2>Hello, I'm <span>FahadGamerXD</span> 👋</h2>
        <p>I am a beginner web developer learning to build amazing websites.</p>
        <button class="btn">Contact Me</button>
    </div>

    <!-- YAHAN APNI IMAGE LAGANI HAI -->
    <img src="myphoto.jpg" alt="My Photo">
</section>

<section class="section">
    <h2>About Me</h2>
    <p>I am learning HTML, CSS and soon JavaScript. This is my first professional website 🚀</p>
</section>

<footer>
    <p>© 2026 Fahad | All Rights Reserved</p>
</footer>

</body>
</html>
