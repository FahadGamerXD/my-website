<head>

  <style>
    body {

      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4facfe, #00f2fe);

      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: orange;
      color: white;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.1);
    }
