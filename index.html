<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio - Luxury Design</title>
    <style>
        /* CSS YAHAN SE SHURU HAI */
        :root {
            --bg-color: #f7f3f0; /* Off-white luxury background */
            --accent-color: #f29c7e; /* Peach/Orange accent */
            --text-dark: #333333;
            --text-light: #6d645e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .menu-btn {
            font-weight: bold;
            cursor: pointer;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 50px;
            position: relative;
        }

        .image-container {
            width: 100%;
            max-width: 1100px;
            height: 65vh;
            overflow: hidden;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Face accuracy ke liye zaroori hai */
            display: block;
        }

        .hero-title {
            position: absolute;
            bottom: -20px;
            left: 50px;
            font-size: 14vw;
            font-weight: 900;
            color: var(--accent-color);
            line-height: 0.8;
            letter-spacing: -5px;
            pointer-events: none;
            z-index: 10;
        }

        /* Intro Text Section */
        .intro-section {
            padding: 150px 50px 100px;
            max-width: 1000px;
        }

        .intro-section h2 {
            font-size: 4.5rem;
            font-weight: 600;
            color: var(--text-light);
            line-height: 1.1;
        }

        .intro-section span.pill {
            display: inline-block;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 0 20px;
            border-radius: 50px;
            font-style: italic;
        }

        /* Services / Projects */
        .services {
            padding: 50px;
            border-top: 1px solid #ddd;
        }

        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            border-bottom: 1px solid #ddd;
        }

        .service-title {
            font-size: 2.5rem;
            font-weight: bold;
        }

        /* Footer Section */
        .footer {
            background-color: var(--accent-color);
            color: white;
            padding: 100px 50px;
            margin-top: 100px;
        }

        .footer h3 {
            font-size: 4rem;
            max-width: 800px;
            line-height: 1.1;
            margin-bottom: 60px;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 30px;
            font-size: 2rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .intro-section h2 { font-size: 2.5rem; }
            .hero-title { font-size: 20vw; left: 20px; }
            .footer h3 { font-size: 2.5rem; }
            .service-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">JUAN MORA</div>
        <div class="menu-btn">MENU</div>
    </nav>

    <section class="hero">
        <div class="image-container">
            <img src="https://yourusername.github.io/images/myphoto.jpg">
        </div>
        <h1 class="hero-title">JUAN MORA</h1>
    </section>

    <section class="intro-section">
        <h2>16 years making users <br> <span class="pill">click</span> and <span class="pill">scroll</span> <br> my designs</h2>
    </section>

    <section class="services">
        <p>I help companies to succeed on projects like:</p>
        
        <div class="service-item">
            <div class="service-title">Websites & Landing pages</div>
            <div class="arrow">→</div>
        </div>

        <div class="service-item">
            <div class="service-title">Visual Branding</div>
            <div class="arrow">→</div>
        </div>

        <div class="service-item">
            <div class="service-title">Product Enhancement</div>
            <div class="arrow">→</div>
        </div>
    </section>

    <footer class="footer">
        <h3>Let's build something people remember</h3>
        <div class="footer-bottom">
            <span>Let's talk</span>
            <span style="font-size: 1rem;">© 2026</span>
        </div>
    </footer>

</body>
</html>
