<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juan Mora | Portfolio</title>
    <!-- Google Fonts for Pro Look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #f3967e; /* Luxury Orange */
            --bg: #f4f1ee;      /* Bone White */
            --dark: #1a1a1a;
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--dark);
            line-height: 1.4;
            overflow-x: hidden;
        }

        /* --- Navigation --- */
        nav {
            display: flex;
            justify-content: space-between;
            padding: 30px 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            mix-blend-mode: difference;
            color: white;
        }

        .logo { font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding-top: 100px;
        }

        .hero-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            width: 400px; /* Adjust according to your photo */
            z-index: 1;
            filter: grayscale(20%);
        }

        .big-name {
            font-size: 15vw;
            font-weight: 900;
            color: var(--primary);
            text-transform: uppercase;
            line-height: 0.8;
            z-index: 0;
            letter-spacing: -5px;
            pointer-events: none;
        }

        .hero-subtext {
            z-index: 2;
            margin-top: -20px;
            font-size: 2.5rem;
            max-width: 600px;
            font-weight: 700;
        }

        .pill {
            display: inline-block;
            border: 1px solid var(--dark);
            border-radius: 50px;
            padding: 0 15px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 400;
            transition: var(--transition);
        }

        .pill:hover {
            background: var(--dark);
            color: white;
        }

        /* --- Services Section --- */
        .services {
            padding: 100px 5%;
            background: white;
        }

        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            border-bottom: 1px solid #ddd;
            text-decoration: none;
            color: var(--dark);
            transition: var(--transition);
        }

        .service-item h2 {
            font-size: 3rem;
            font-weight: 700;
        }

        .service-item:hover {
            padding-left: 30px;
            color: var(--primary);
        }

        /* --- Footer/CTA --- */
        .cta {
            background-color: var(--primary);
            padding: 120px 5%;
            color: white;
            text-align: left;
        }

        .cta h2 {
            font-size: 5rem;
            max-width: 800px;
            line-height: 1;
            margin-bottom: 40px;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 20px;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .big-name { font-size: 20vw; }
            .hero-image { width: 80%; }
            .service-item h2 { font-size: 1.5rem; }
            .cta h2 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Juan Mora</div>
        <div class="menu">MENU</div>
    </nav>

    <section class="hero">
        <h1 class="big-name">JUAN MORA</h1>
        
        <!-- Replace 'your-photo.png' with your actual image path -->
        <img src="your-photo.png" alt="Juan Mora" class="hero-image">

        <div class="hero-subtext">
            16 years making doors <br>
            <span class="pill">click</span> and <span class="pill">scroll</span> <br>
            my designs
        </div>
    </section>

    <section class="services">
        <p style="text-transform: uppercase; font-size: 0.8rem; margin-bottom: 40px;">I help companies to succeed on projects like:</p>
        
        <a href="#" class="service-item">
            <h2>Websites & Landing pages</h2>
            <span>&rarr;</span>
        </a>
        <a href="#" class="service-item">
            <h2>Visual Branding</h2>
            <span>&rarr;</span>
        </a>
        <a href="#" class="service-item">
            <h2>Product Enhancement</h2>
            <span>&rarr;</span>
        </a>
    </section>

    <section class="cta">
        <h2>Let's build something people remember</h2>
        <div class="footer-bottom">
            <div>Let's talk</div>
            <div>© 2026</div>
        </div>
    </section>

</body>
</html>
