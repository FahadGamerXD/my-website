<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juan Mora | Pro Portfolio</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #ff8c7a; /* Aapka theme color */
            --bg-color: #f4f1ee;
            --text-dark: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* Custom cursor ke liye */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            overflow: hidden; /* Pro landing page feel */
        }

        /* --- Custom Cursor --- */
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease-out;
            transform: translate(-50%, -50%);
        }

        /* --- Navigation --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 60px;
            position: fixed;
            width: 100%;
            z-index: 100;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            letter-spacing: 1px;
            font-size: 1.2rem;
        }

        .dark-mode-btn {
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: var(--glass);
            backdrop-filter: blur(10px);
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .dark-mode-btn:hover {
            background: var(--text-dark);
            color: white;
            transform: translateY(-3px);
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Big Background Text */
        .hero-title {
            font-family: 'Syne', sans-serif;
            font-size: 25vw;
            font-weight: 800;
            color: var(--primary-color);
            position: absolute;
            z-index: 1;
            user-select: none;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Image Styling */
        .hero-img-container {
            position: relative;
            z-index: 2;
            width: 450px;
            height: 600px;
            animation: float 5s ease-in-out infinite;
        }

        .hero-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Light Shadow for depth */
            filter: drop-shadow(0 30px 50px rgba(0,0,0,0.15));
        }

        /* --- Bottom Ticker / Banner --- */
        .footer-banner {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: var(--primary-color);
            padding: 20px 0;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-text {
            display: inline-block;
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            color: white;
            font-weight: 700;
            animation: ticker 20s linear infinite;
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Hover Interaction: Text expands when hovering image */
        .hero:hover .hero-title {
            letter-spacing: 20px;
            opacity: 0.8;
        }

    </style>
</head>
<body>

    <div class="cursor"></div>

    <nav>
        <div class="logo">JUAN MORA</div>
        <button class="dark-mode-btn">DARK MODE</button>
    </nav>

    <section class="hero">
        <h1 class="hero-title">JUAN</h1>
        
        <div class="hero-img-container">
            <!-- image_ccfb08.jpg yahan replace hogi -->
            <img src="image_ccfb08.jpg" alt="Juan Mora Profile">
        </div>
    </section>

    <div class="footer-banner">
        <div class="ticker-text">
            DEVELOPMENT • STRATEGY • DESIGN • DEVELOPMENT • STRATEGY • DESIGN • DEVELOPMENT • STRATEGY • DESIGN
        </div>
    </div>

    <script>
        // Custom Cursor Logic
        const cursor = document.querySelector('.cursor');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Hover effect for cursor
        const links = document.querySelectorAll('button, .hero-img-container');
        links.forEach(link => {
            link.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(3)';
                cursor.style.backgroundColor = 'rgba(255, 140, 122, 0.2)';
            });
            link.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                cursor.style.backgroundColor = 'transparent';
            });
        });
    </script>
</body>
</html>
