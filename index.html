<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juan Mora | Elite Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        :root {
            --primary: #f3967e;
            --bg: #f4f1ee;
            --dark: #1a1a1a;
            --white: #ffffff;
        }

        body.dark-mode {
            --bg: #1a1a1a;
            --dark: #f4f1ee;
            --white: #252525;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--dark);
            transition: background-color 0.5s ease;
            overflow-x: hidden;
        }

        /* --- Custom Cursor --- */
        #cursor {
            position: fixed;
            width: 15px;
            height: 15px;
            background: var(--primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            mix-blend-mode: difference;
        }

        /* --- Header & Toggle --- */
        nav {
            display: flex;
            justify-content: space-between;
            padding: 40px 5%;
            position: fixed;
            width: 100%;
            z-index: 100;
            font-weight: 700;
        }

        .mode-toggle {
            cursor: pointer;
            border: 1px solid var(--dark);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .big-name {
            font-size: 20vw;
            font-weight: 900;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: -10px;
            z-index: 1;
        }

        .hero-image {
            position: absolute;
            height: 80vh;
            z-index: 2;
            /* Filter for that luxury aesthetic */
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.2));
        }

        /* --- Infinite Marquee --- */
        .marquee {
            background: var(--primary);
            color: white;
            padding: 20px 0;
            overflow: hidden;
            white-space: nowrap;
            display: flex;
            transform: rotate(-2deg);
            margin-top: -50px;
            z-index: 5;
            position: relative;
        }

        .marquee h2 {
            font-size: 4rem;
            text-transform: uppercase;
            display: inline-block;
            animation: scroll 20s linear infinite;
        }

        @keyframes scroll {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* --- Work Section --- */
        .work-container { padding: 100px 5%; }

        .work-card {
            background: var(--white);
            border-radius: 30px;
            padding: 50px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.4s ease;
        }

        .work-card:hover {
            transform: scale(1.02);
        }

        .work-info h3 { font-size: 2.5rem; margin-bottom: 10px; }
        
        .btn-round {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 1px solid var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .btn-round:hover {
            background: var(--dark);
            color: var(--bg);
        }

    </style>
</head>
<body>

    <div id="cursor"></div>

    <nav>
        <div class="logo">JUAN MORA</div>
        <div class="mode-toggle" onclick="toggleMode()">DARK MODE</div>
    </nav>

    <section class="hero">
        <h1 class="big-name">JUAN</h1>
        <!-- Apni photo 'your-photo.png' yahan add karein -->
        <img src="your-photo.png" alt="Juan Mora" class="hero-image">
    </section>

    <!-- Moving Text Marquee -->
    <div class="marquee">
        <h2> &nbsp; • STRATEGY • DESIGN • BRANDING • EXPERIENCE • DEVELOPMENT • STRATEGY • DESIGN • BRANDING • EXPERIENCE • DEVELOPMENT</h2>
    </div>

    <section class="work-container">
        <div class="work-card">
            <div class="work-info">
                <p>01 / ADVERTISING</p>
                <h3>Luxury Campaigns</h3>
            </div>
            <div class="btn-round">VIEW</div>
        </div>

        <div class="work-card">
            <div class="work-info">
                <p>02 / PRODUCT</p>
                <h3>Digital Enhancement</h3>
            </div>
            <div class="btn-round">VIEW</div>
        </div>
    </section>

    <script>
        // Custom Cursor
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.1 });
        });

        // Dark Mode Toggle
        function toggleMode() {
            document.body.classList.toggle('dark-mode');
            const btn = document.querySelector('.mode-toggle');
            btn.innerHTML = document.body.classList.contains('dark-mode') ? 'LIGHT MODE' : 'DARK MODE';
        }

        // Scroll Animations
        gsap.registerPlugin(ScrollTrigger);

        gsap.from(".work-card", {
            scrollTrigger: {
                trigger: ".work-card",
                start: "top 80%",
            },
            y: 100,
            opacity: 0,
            stagger: 0.2,
            duration: 1
        });
    </script>
</body>
</html>
