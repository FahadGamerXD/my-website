<!DOCTYPE html>
<html>
<head>
    <title>Meri Stylish Website</title>

    <style>
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
        }

        .box {
            background: rgba(0, 0, 0, 0.5);
            padding: 30px;
            margin: 100px auto;
            width: 60%;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
        }

        button {
            background: #ff7b00;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #ff5500;
        }
    </style>

</head>
<body>

    <div class="box">
        <h1>Hello Saad 👋</h1>
        <p>Welcome to my stylish website 🚀</p>
        <button onclick="alert('Welcome Bhai 😎')">Click Me</button>
    </div>

</body>
</html>
